name: CF Upload Probe

# Throwaway diagnostic: which host/path still accepts a CurseForge upload.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Host and path variants
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -uo pipefail
          meta='{"releaseType":"alpha","gameVersions":["1.20.1","Forge"],"displayName":"probe"}'
          printf '%s' "$meta" > meta.json
          echo 'x' > dummy.jar

          probe() {
            local label="$1"; shift
            local code
            code=$(curl -sS -o body.txt -w '%{http_code}' "$@" || echo curlfail)
            echo "=== ${label} -> HTTP ${code}"
            head -c 200 body.txt | tr -d '\r' | tr '\n' ' '
            echo
          }

          H=(-H "X-Api-Token: ${CF_TOKEN}")
          M=(-F "metadata=@meta.json;type=application/json")
          F=(-F "file=@dummy.jar;type=application/java-archive")

          probe "A_minecraft_host_upload_GET" \
            "${H[@]}" "https://minecraft.curseforge.com/api/projects/1750387/upload"
          probe "B_minecraft_host_project_GET" \
            "${H[@]}" "https://minecraft.curseforge.com/api/projects/1750387"
          probe "C_www_host_upload_POST" \
            "${H[@]}" "${M[@]}" "${F[@]}" "https://www.curseforge.com/api/projects/1750387/upload"
          probe "D_api_host_upload_file_POST" \
            "${H[@]}" "${M[@]}" "${F[@]}" "https://api.curseforge.com/v1/projects/1750387/upload-file"
          probe "E_api_host_mods_1750387_files_GET" \
            -H "x-api-key: ${CF_TOKEN}" "https://api.curseforge.com/v1/mods/1750387/files"
          probe "F_minecraft_host_upload_alt_token_param" \
            -H "X-Api-Token: ${CF_TOKEN}" "${M[@]}" "${F[@]}" \
            "https://minecraft.curseforge.com/api/projects/1750387/upload?token=${CF_TOKEN}"
