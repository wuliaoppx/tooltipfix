name: CF Upload Probe 2

# Throwaway diagnostic: metadata as a plain form field instead of a file part.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Metadata field shapes
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -uo pipefail
          meta='{"releaseType":"alpha","gameVersions":["1.20.1","Forge"],"displayName":"probe"}'
          printf '%s' "$meta" > meta.json
          echo 'x' > dummy.jar
          URL="https://minecraft.curseforge.com/api/projects/1750387/upload"

          probe() {
            local label="$1"; shift
            local code
            code=$(curl -sS -o body.txt -w '%{http_code}' "$@" || echo curlfail)
            echo "=== ${label} -> HTTP ${code}"
            head -c 240 body.txt | tr -d '\r' | tr '\n' ' '
            echo
          }

          probe "1_plain_field_inline_json" \
            -H "X-Api-Token: ${CF_TOKEN}" \
            -F "metadata=${meta};type=application/json" \
            -F "file=@dummy.jar;type=application/java-archive" "$URL"

          probe "2_plain_field_from_file" \
            -H "X-Api-Token: ${CF_TOKEN}" \
            -F "metadata=<meta.json;type=application/json" \
            -F "file=@dummy.jar;type=application/java-archive" "$URL"

          probe "3_plain_field_with_accept" \
            -H "X-Api-Token: ${CF_TOKEN}" -H "Accept: application/json" \
            -F "metadata=${meta};type=application/json" \
            -F "file=@dummy.jar;type=application/java-archive" "$URL"

          probe "4_no_metadata_only_file" \
            -H "X-Api-Token: ${CF_TOKEN}" \
            -F "file=@dummy.jar;type=application/java-archive" "$URL"
